[DEFAULT]
VERSION = v3.1.0
FONT_NAME = PlemoCJK
JP_FONT = IBM-Plex-Sans-JP/unhinted/IBMPlexSansJP-{style}.ttf
ENG_FONT = IBM-Plex-Mono/IBMPlexMono-{style}.ttf
HACK_FONT = hack/Hack-{style}.ttf
SOURCE_FONTS_DIR = source
BUILD_FONTS_DIR = build
VENDER_NAME = TWR
FONTFORGE_PREFIX = fontforge_
FONTTOOLS_PREFIX = fonttools_
IDEOGRAPHIC_SPACE = AdjustedGlyphs/Ideographic_Space.sfd
ADJUST_R = AdjustedGlyphs/r-{style}.sfd
CONSOLE_STR = Console
WIDTH_35_STR = 35
NERD_FONTS_STR = NF
INVISIBLE_ZENKAKU_SPACE_STR = HS
EM_ASCENT = 880
EM_DESCENT = 120
OS2_ASCENT = 950
OS2_DESCENT = 225
HALF_WIDTH_12 = 528
FULL_WIDTH_35 = 1000
ITALIC_ANGLE = 9

# ---------------------------------------------------------------------------
# PlemoCJK: 地域別サブフォントの設定
# ---------------------------------------------------------------------------
[regions]
# 生成する地域の一覧 (サブフォント名の修飾子としてもそのまま使う)
REGIONS = SC, TC, JP, KR

# 各地域の IBM Plex Sans 原本。fetch_sources.py が取得する
# (JP は上流 PlemolJP がリポジトリにコミットしているものをそのまま使う)
REGION_SOURCE_FONT = IBM-Plex-Sans-{region}/unhinted/IBMPlexSans{region}-{style}.ttf

# prepare_cjk.py が出力する CJK 側入力フォント。
# fontforge_script.py は --region 指定時にこちらを JP_FONT の代わりに使う
PREPARED_FONT = prepared/PlemoCJK-{region}-{style}.ttf

# 回退補入 (fallback fill) の優先順。
# Adobe Source Han Sans の region-map が実際に採用している地域間の近さに基づく。
# 「自地域に無いコードポイントだけ」を前から順に補い、既存グリフは絶対に上書きしない。
# 末尾の KR は主にハングルを全地域へ入れるためのもの。
FALLBACK_SC = JP, TC, KR
FALLBACK_TC = SC, JP, KR
FALLBACK_JP = SC, TC, KR
FALLBACK_KR = JP, SC, TC

# 補入対象から外すコードポイント。
# U+274C CROSS MARK は OS 付属の絵文字フォントにフォールバックさせたいので入れない
# (上流 PlemolJP が英数字側から削除しているのと同じ意図)。KR 原本には存在するため除外する。
EXCLUDE_CODEPOINTS = 0x274C

# CJK 互換漢字 (U+F900-FAFF, U+2F800-2FA1D) を正規等価な統合漢字のグリフに
# エイリアスする。IBM Plex Sans にはこのブロックのグリフが無く、
# KS X 1001 の 268 字 / GBK の一部が欠けてしまうため。
# Unicode 上は正規等価 (読みだけが違う同字) なので同じグリフを指して問題無い。
ALIAS_COMPAT_IDEOGRAPHS = true

# 主地域フォントから残す GSUB feature。ここに無い feature とそれだけが参照する
# グリフは prepare_cjk.py が捨てる。理由は 2 つ:
#   - 等幅プログラミングフォントでは幅バリアント (pwid/hwid/fwid/twid/qwid) と
#     縦組み (vert/vrt2) は適用されると等幅が壊れるので有害
#   - Nerd Fonts 版 (+10,522 グリフ) を入れると 65,535 グリフ制限を超えるため
#     IBM Plex Sans JP の異体字 (jp78/jp83/hojo/nlck/expt/ruby/nalt/ital 等,
#     合計約 5,800 グリフ) を落とす必要がある
GSUB_KEEP_FEATURES = ccmp, locl, liga, calt, rlig, salt, case,
    ss01, ss02, ss03, ss04, zero, ordn, frac, afrc, numr, dnom, sups, subs, sinf

# ハングル関連コードポイント (全 4 地域に入れる)。
HANGUL_RANGES = 1100-11FF, 302E-302F, 3130-318F, 3200-321E, 3260-327F,
    A960-A97F, AC00-D7A3, D7B0-D7FB, FFA0-FFDC
# 半角ハングル字母。全角化の対象から外す
HALF_WIDTH_HANGUL_RANGES = FFA1-FFDC

[region.SC]
# 家族名に入る修飾子
LABEL = SC
# meta テーブル dlng / slng
META_DLNG = Hans
META_SLNG = Hans
# OS/2 ulCodePageRange のビット番号 (0 = 1252 Latin-1, 18 = 936 Chinese Simplified)
CODE_PAGE_BITS = 0, 18
# name テーブルの多言語ファミリー名に付けるラベル
LOCALIZED_LABELS = zh_CN:简体中文, zh_TW:簡體中文, ja:簡体字中国語, ko:중국어 간체

[region.TC]
LABEL = TC
META_DLNG = Hant
META_SLNG = Hant
# 20 = 950 Chinese Traditional
CODE_PAGE_BITS = 0, 20
LOCALIZED_LABELS = zh_CN:繁体中文, zh_TW:繁體中文, ja:繁体字中国語, ko:중국어 번체

[region.JP]
LABEL = JP
META_DLNG = Jpan
META_SLNG = Jpan
# 17 = 932 JIS/Japan
CODE_PAGE_BITS = 0, 17
LOCALIZED_LABELS = zh_CN:日文, zh_TW:日文, ja:日本語, ko:일본어

[region.KR]
LABEL = KR
META_DLNG = Kore
META_SLNG = Kore
# 19 = 949 Korean Wansung, 21 = 1361 Korean Johab
CODE_PAGE_BITS = 0, 19, 21
LOCALIZED_LABELS = zh_CN:韩文, zh_TW:韓文, ja:韓国語, ko:한국어

# ---------------------------------------------------------------------------
# PlemoCJK: ビルドマトリクス
# ---------------------------------------------------------------------------
[build]
# 既定のビルド対象バリアント (make.sh の VARIANT_SET=default)
# 35 幅版と HS (全角スペース非可視化) 版はコードパスは残すが既定では作らない
DEFAULT_VARIANTS = default, Console, ConsoleNF
# VARIANT_SET=full のときに作るバリアント
FULL_VARIANTS = default, 35, Console, 35Console, ConsoleNF, 35ConsoleNF,
    HS, 35HS, ConsoleHS, 35ConsoleHS
# TTC に束ねるサブフォントの順序
TTC_ORDER = SC, TC, JP, KR
# hdmx を付けるのは 1:2 幅のバリアントのみ (3:5 幅では 5*half == 3*full の整数解が無い)
HDMX_PPEM_MIN = 11
HDMX_PPEM_MAX = 47
