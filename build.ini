[DEFAULT]
VERSION = v0.0.2
FONT_NAME = PlemoCJK
JP_FONT = IBM-Plex-Sans-JP/unhinted/IBMPlexSansJP-{style}.ttf
ENG_FONT = IBM-Plex-Mono/IBMPlexMono-{style}.ttf
HACK_FONT = hack/Hack-{style}.ttf
SOURCE_FONTS_DIR = source
BUILD_FONTS_DIR = build
VENDER_NAME = TWR
FONTFORGE_PREFIX = fontforge_
FONTTOOLS_PREFIX = fonttools_
IDEOGRAPHIC_SPACE = AdjustedGlyphs/Ideographic_Space.sfd
ADJUST_R = AdjustedGlyphs/r-{style}.sfd
CONSOLE_STR = Console
WIDTH_35_STR = 35
NERD_FONTS_STR = NF
INVISIBLE_ZENKAKU_SPACE_STR = HS
EM_ASCENT = 880
EM_DESCENT = 120
TYPO_ASCENT = 990
TYPO_DESCENT = 260
WIN_ASCENT = 1025
WIN_DESCENT = 275
HALF_WIDTH_12 = 528
HALF_WIDTH_36 = 600
FULL_WIDTH_35 = 1000
FULL_WIDTH_36 = 1200
WIDTH_36_STR = 36
ITALIC_ANGLE = 9

# ---------------------------------------------------------------------------
# PlemoCJK: region-specific sub-font settings
# ---------------------------------------------------------------------------
[regions]
# List of regions to generate (also used directly as sub-font name modifiers)
REGIONS = SC, TC, JP, KR

# IBM Plex Sans source for each region, fetched by fetch_sources.py
# (JP uses the files already committed by upstream PlemolJP)
REGION_SOURCE_FONT = IBM-Plex-Sans-{region}/unhinted/IBMPlexSans{region}-{style}.ttf

# Location of fonts rebuilt from the IBM Glyphs master instead of the release
# (output by regen_sc_text.py; .gitignored)
REGENERATED_FONT = regenerated/IBMPlexSans{region}-{style}.ttf

# "region:weight" pairs that use REGENERATED_FONT instead of REGION_SOURCE_FONT.
# The IBM release of SC Text is interpolated at 425, about 5% thinner than
# JP/TC Text (450) (horizontal stroke of U+4E00: 80 vs 84, vertical stroke of
# U+4E28: 84 vs 89). regen_sc_text.py rebuilds it from the master at 450.
# Set empty to use the release for all weights.
REGENERATED_STYLES = SC:Text

# CJK input font produced by prepare_cjk.py.
# fontforge_script.py uses this instead of JP_FONT when --region is specified
PREPARED_FONT = prepared/PlemoCJK-{region}-{style}.ttf

# Fallback fill priority order.
# Based on the inter-region proximity used by Adobe Source Han Sans region-map.
# Only codepoints missing from the primary region are filled in order;
# existing glyphs are never overwritten. The trailing KR primarily brings
# Hangul into all regions.
FALLBACK_SC = JP, TC, KR
FALLBACK_TC = SC, JP, KR
FALLBACK_JP = SC, TC, KR
FALLBACK_KR = JP, SC, TC

# Codepoints excluded from fallback fill.
# U+274C CROSS MARK is excluded so that the OS emoji font provides it instead
# (same intent as upstream PlemolJP removing it from the Latin side).
# It exists in the KR source, so it must be explicitly excluded.
EXCLUDE_CODEPOINTS = 0x274C

# Alias CJK compatibility ideographs (U+F900-FAFF, U+2F800-2FA1D) to the
# canonically equivalent unified ideograph glyphs. IBM Plex Sans has no
# glyphs for this block, which would leave 268 KS X 1001 / some GBK
# characters missing. They are canonically equivalent in Unicode (same
# character, different reading), so pointing to the same glyph is correct.
ALIAS_COMPAT_IDEOGRAPHS = true

# GSUB features to keep from the primary region font. Features not listed here
# and glyphs referenced only by them are dropped by prepare_cjk.py.
# Two reasons:
#   - In a monospace programming font, width variants (pwid/hwid/fwid/twid/qwid)
#     and vertical layout (vert/vrt2) break the fixed-width property
#   - With Nerd Fonts (+10,522 glyphs), the 65,535 glyph limit is exceeded,
#     requiring IBM Plex Sans JP alternates (jp78/jp83/hojo/nlck/expt/ruby/
#     nalt/ital etc., ~5,800 glyphs total) to be dropped
GSUB_KEEP_FEATURES = ccmp, locl, liga, calt, rlig, salt, case,
    ss01, ss02, ss03, ss04, zero, ordn, frac, afrc, numr, dnom, sups, subs, sinf

# Hangul-related codepoints (included in all 4 regions).
HANGUL_RANGES = 1100-11FF, 302E-302F, 3130-318F, 3200-321E, 3260-327F,
    A960-A97F, AC00-D7A3, D7B0-D7FB, FFA0-FFDC
# Half-width Hangul jamo. Excluded from full-width conversion
HALF_WIDTH_HANGUL_RANGES = FFA1-FFDC

[region.SC]
# Modifier appended to the family name
LABEL = SC
# meta table dlng / slng
META_DLNG = Hans
META_SLNG = Hans
# OS/2 ulCodePageRange bit numbers (0 = 1252 Latin-1, 18 = 936 Chinese Simplified)
CODE_PAGE_BITS = 0, 18
# Localized labels for multilingual family names in the name table
LOCALIZED_LABELS = zh_CN:简体中文, zh_TW:簡體中文, ja:簡体字中国語, ko:중국어 간체

[region.TC]
LABEL = TC
META_DLNG = Hant
META_SLNG = Hant
# 20 = 950 Chinese Traditional
CODE_PAGE_BITS = 0, 20
LOCALIZED_LABELS = zh_CN:繁体中文, zh_TW:繁體中文, ja:繁体字中国語, ko:중국어 번체

[region.JP]
LABEL = JP
META_DLNG = Jpan
META_SLNG = Jpan
# 17 = 932 JIS/Japan
CODE_PAGE_BITS = 0, 17
LOCALIZED_LABELS = zh_CN:日文, zh_TW:日文, ja:日本語, ko:일본어

[region.KR]
LABEL = KR
META_DLNG = Kore
META_SLNG = Kore
# 19 = 949 Korean Wansung, 21 = 1361 Korean Johab
CODE_PAGE_BITS = 0, 19, 21
LOCALIZED_LABELS = zh_CN:韩文, zh_TW:韓文, ja:韓国語, ko:한국어

# ---------------------------------------------------------------------------
# PlemoCJK: build matrix
# ---------------------------------------------------------------------------
[build]
DEFAULT_VARIANTS = default, Term, Natural
# Sub-font order within the TTC bundle
TTC_ORDER = SC, TC, JP, KR
# hdmx is added for 1:2 width variants (12 and 36); 3:5 has no integer ppem solution
HDMX_PPEM_MIN = 11
HDMX_PPEM_MAX = 47
